name: One-shot dependency remediation (isolated branch)

on:
  push:
    branches: [security/remediate-prod-deps-20261102]
    paths: [.github/workflows/one-shot-security-remediation.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Upgrade vulnerable direct dependencies without major-version jumps
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 @sentry/nextjs@10.78.0
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit repaired lockfile to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Next Sentry and compatible vulnerable transitive packages"
            git push origin HEAD:security/remediate-prod-deps-20261102
          fi
      - name: Audit production dependencies and summarize exact remaining advisories
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          if (a.error) { console.error(a.error); process.exit(2); }
          const v = a.metadata?.vulnerabilities || {};
          const selected = Object.entries(a.vulnerabilities || {})
            .filter(([,x]) => ['critical','high'].includes(x.severity))
            .map(([name,x]) => ({ name, severity:x.severity, fix:x.fixAvailable }));
          const msg = [
            '### Production dependency security gate',
            '',
            'Critical: ' + (v.critical || 0) + '; High: ' + (v.high || 0) +
              '; Moderate: ' + (v.moderate || 0) + '; Low: ' + (v.low || 0),
            '',
            'Remaining high/critical dependencies: ' + JSON.stringify(selected),
            '',
            'No production deploy. No forced major upgrades.'
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, msg+'\n');
          console.log(msg);
          if ((v.critical || 0) + (v.high || 0) > 0) process.exitCode=1;
          NODE
