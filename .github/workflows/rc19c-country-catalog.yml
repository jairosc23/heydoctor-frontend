name: RC19C Country Catalog QA
on:
  push:
    branches:
      - qa/rc19c-country-catalog-discovery-20261123
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc19c-country-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  international-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Offline-only safety guard
        run: |
          test -z "${DATABASE_URL:-}"
          test -z "${RAILWAY_PROJECT_ID:-}"
          test -z "${STRIPE_SECRET_KEY:-}"
      - name: Country catalog + jurisdiction UI regressions
        run: node --import tsx --test lib/patient-growth/discovery-country-catalog.test.ts lib/patient-growth/jurisdiction-ui.test.ts lib/services/public-discovery.test.ts
      - name: TypeScript
        run: npm run typecheck
      - name: Inspect formatting delta
        run: |
          for path in app/medicos/medicos-client.tsx lib/patient-growth/discovery-country-catalog.ts lib/patient-growth/discovery-country-catalog.test.ts; do
            npx prettier "$path" > /tmp/rc19c-prettier.tmp
            diff -u "$path" /tmp/rc19c-prettier.tmp || true
          done
      - name: Check formatting
        run: npx prettier --check app/medicos/medicos-client.tsx lib/patient-growth/discovery-country-catalog.ts lib/patient-growth/discovery-country-catalog.test.ts
