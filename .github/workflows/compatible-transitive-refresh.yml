name: Compatible transitive security refresh

on:
  push:
    branches: [security/remediate-prod-deps-20261102]
    paths: [.github/workflows/compatible-transitive-refresh.yml]

permissions:
  contents: write

jobs:
  compatible-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Update compatible locked dependencies (no major upgrades)
        run: |
          npm install --global npm@11
          npm --version
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Record compatible lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): refresh compatible transitive dependency versions"
            git push origin HEAD:security/remediate-prod-deps-20261102
          fi
      - name: Production-only advisory audit
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('audit.json','utf8'));
          if(a.error){console.error(a.error);process.exit(2);}
          const v=a.metadata?.vulnerabilities||{};
          console.log('PROD_AUDIT_CRITICAL='+(v.critical||0));
          console.log('PROD_AUDIT_HIGH='+(v.high||0));
          console.log('PROD_AUDIT_MODERATE='+(v.moderate||0));
          console.log('UNRESOLVED='+JSON.stringify(Object.entries(a.vulnerabilities||{}).filter(([,x])=>x.severity==='critical'||x.severity==='high').map(([n,x])=>({name:n,severity:x.severity,fix:x.fixAvailable}))));
          if((v.critical||0)+(v.high||0)>0)process.exitCode=1;
          NODE
