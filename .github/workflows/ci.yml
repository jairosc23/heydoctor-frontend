# HeyDoctor Frontend CI — PQ-09 Quality Gates
#
# Required check (branch protection): job name «frontend» (aggregate).
# Levels: see docs/pq-09-quality-gates.md
#   L1 quality  — always (PR)
#   L2 e2e-p0     — when 7 E2E secrets present; controlled skip otherwise
#   L2 e2e-f2-01  — Agenda+Auth reliability when auth triad present (F2-01)
#   L3 release    — documented (tag workflow + checklist); not enforced here
#
# PQ-01: Playwright hardening (retries, artifacts, test:e2e:p0).
# F2-01: Agenda & Auth E2E reliability (auth triad only).
# E2E_BASE_URL is resolved from the GitHub Deployment for github.sha
# (Vercel Preview READY). It is never read from a Repository Secret.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  # ── Nivel 1 — obligatorias en cada PR ─────────────────────────
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Medical Copilot CI foundation pack (F2-14)
        run: npm run test:copilot:ci

      - name: Component tests + coverage (PQ-02 / PQ-03)
        run: npm run test:component:cov

      - name: Coverage governance report (PQ-03)
        if: always()
        run: npm run coverage:report

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-${{ github.run_id }}
          path: |
            coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ── Preview URL for this SHA (GitHub Deployments / Vercel) ──
  resolve-preview:
    name: resolve-preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - name: Resolve READY Vercel Preview for github.sha
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          out = os.environ["GITHUB_OUTPUT"]
          deadline = time.time() + 480
          last = "no GitHub Deployments for this SHA yet"

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          while time.time() < deadline:
              try:
                  deps = api(f"/repos/{repo}/deployments?sha={sha}&per_page=25")
              except urllib.error.HTTPError as e:
                  last = f"GitHub Deployments API HTTP {e.code}"
                  time.sleep(15)
                  continue
              if not isinstance(deps, list) or not deps:
                  last = f"no GitHub Deployments for SHA {sha}"
                  print(last, flush=True)
                  time.sleep(15)
                  continue
              ready = []
              for d in deps:
                  did = d.get("id")
                  env = d.get("environment") or ""
                  prod = bool(d.get("production_environment"))
                  try:
                      statuses = api(f"/repos/{repo}/deployments/{did}/statuses")
                  except urllib.error.HTTPError as e:
                      last = f"deployment {did} statuses HTTP {e.code}"
                      continue
                  if not statuses:
                      last = f"deployment {did} env={env} has no statuses"
                      print(last, flush=True)
                      continue
                  top = statuses[0]
                  state = top.get("state") or ""
                  url = (top.get("environment_url") or "").rstrip("/")
                  print(
                      f"deployment {did} env={env} prod={prod} state={state} url={url}",
                      flush=True,
                  )
                  if state in ("error", "failure"):
                      last = f"deployment {did} env={env} state={state}"
                      continue
                  if state == "success" and url:
                      ready.append((prod, did, url))
                      continue
                  last = f"deployment {did} env={env} state={state} (waiting for success)"
              if ready:
                  ready.sort(key=lambda item: (item[0] is True, -item[1]))
                  url = ready[0][2]
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"url={url}\n")
                  print(f"Resolved Preview URL: {url}", flush=True)
                  sys.exit(0)
              time.sleep(15)

          print(
              f"::error::Infrastructure: no READY Vercel Preview for SHA {sha}. "
              f"{last}. Playwright will not run.",
              flush=True,
          )
          sys.exit(1)
          PY

  # ── Nivel 2 — E2E P0 (degradación controlada sin secrets) ─────
  e2e-p0:
    name: e2e-p0
    needs: [quality, resolve-preview, e2e-f2-01]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ needs.resolve-preview.outputs.url }}
      E2E_DOCTOR_EMAIL: ${{ secrets.E2E_DOCTOR_EMAIL }}
      E2E_DOCTOR_PASSWORD: ${{ secrets.E2E_DOCTOR_PASSWORD }}
      E2E_CONSULTATION_HTA: ${{ secrets.E2E_CONSULTATION_HTA }}
      E2E_CONSULTATION_DM2: ${{ secrets.E2E_CONSULTATION_DM2 }}
      E2E_CONSULTATION_ACUTE: ${{ secrets.E2E_CONSULTATION_ACUTE }}
      E2E_CONSULTATION_PAYMENT: ${{ secrets.E2E_CONSULTATION_PAYMENT }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_STRICT: "1"
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      result: ${{ steps.outcome.outputs.result }}
    steps:
      - name: Detect E2E P0 secrets
        id: detect
        run: |
          missing=()
          for key in \
            E2E_DOCTOR_EMAIL \
            E2E_DOCTOR_PASSWORD \
            E2E_CONSULTATION_HTA \
            E2E_CONSULTATION_DM2 \
            E2E_CONSULTATION_ACUTE \
            E2E_CONSULTATION_PAYMENT
          do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "mode=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E P0 skipped — missing secrets: ${missing[*]} (controlled degradation; L1 still required)"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
            echo "E2E P0 secrets configured — gate is blocking for this job"
          fi

      - name: Require resolved Preview URL
        if: steps.detect.outputs.mode == 'run'
        run: |
          if [[ -z "$E2E_BASE_URL" ]]; then
            echo "::error::Infrastructure: resolved E2E_BASE_URL is empty; Playwright will not run."
            exit 1
          fi
          echo "E2E_BASE_URL=${E2E_BASE_URL}"

      - uses: actions/checkout@v4
        if: steps.detect.outputs.mode == 'run'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.mode == 'run'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.mode == 'run'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.detect.outputs.mode == 'run'
        run: npx playwright install --with-deps chromium

      - name: E2E Clinical P0 (ADR-019 / PQ-01)
        id: e2e_run
        if: steps.detect.outputs.mode == 'run'
        continue-on-error: true
        run: npm run test:e2e:p0

      - name: Upload Playwright artifacts
        if: always() && steps.detect.outputs.mode == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-p0-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record E2E outcome
        id: outcome
        if: always()
        run: |
          mode="${{ steps.detect.outputs.mode }}"
          if [[ "$mode" == "skipped" ]]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ steps.e2e_run.outcome }}" == "success" ]]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=fail" >> "$GITHUB_OUTPUT"
          exit 1

  # ── Nivel 2 — F2-01 Agenda + Auth (triad auth; degradación controlada) ─
  e2e-f2-01:
    name: e2e-f2-01
    needs: [quality, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: ${{ needs.resolve-preview.outputs.url }}
      E2E_DOCTOR_EMAIL: ${{ secrets.E2E_DOCTOR_EMAIL }}
      E2E_DOCTOR_PASSWORD: ${{ secrets.E2E_DOCTOR_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      result: ${{ steps.outcome.outputs.result }}
    steps:
      - name: Detect F2-01 auth triad
        id: detect
        run: |
          missing=()
          for key in E2E_DOCTOR_EMAIL E2E_DOCTOR_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "mode=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::F2-01 E2E skipped — missing auth secrets: ${missing[*]}"
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
            echo "F2-01 auth triad configured — Agenda/Auth gate blocking for this job"
          fi

      - name: Require resolved Preview URL
        if: steps.detect.outputs.mode == 'run'
        run: |
          if [[ -z "$E2E_BASE_URL" ]]; then
            echo "::error::Infrastructure: resolved E2E_BASE_URL is empty; Playwright will not run."
            exit 1
          fi
          echo "E2E_BASE_URL=${E2E_BASE_URL}"

      - uses: actions/checkout@v4
        if: steps.detect.outputs.mode == 'run'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.mode == 'run'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.mode == 'run'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.detect.outputs.mode == 'run'
        run: npx playwright install --with-deps chromium

      - name: E2E F2-01 Agenda + Auth reliability
        id: e2e_run
        if: steps.detect.outputs.mode == 'run'
        continue-on-error: true
        run: npm run test:e2e:f2-01

      - name: Upload Playwright artifacts (F2-01)
        if: always() && steps.detect.outputs.mode == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-f2-01-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record F2-01 outcome
        id: outcome
        if: always()
        run: |
          mode="${{ steps.detect.outputs.mode }}"
          if [[ "$mode" == "skipped" ]]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ steps.e2e_run.outcome }}" == "success" ]]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=fail" >> "$GITHUB_OUTPUT"
          exit 1

  # ── Aggregate — required check name «frontend» ────────────────
  frontend:
    name: frontend
    needs: [quality, resolve-preview, e2e-p0, e2e-f2-01]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Quality Gates (PQ-09 + F2-01)
        env:
          QUALITY: ${{ needs.quality.result }}
          PREVIEW: ${{ needs.resolve-preview.result }}
          PREVIEW_URL: ${{ needs.resolve-preview.outputs.url }}
          E2E_JOB: ${{ needs.e2e-p0.result }}
          E2E_MODE: ${{ needs.e2e-p0.outputs.mode }}
          E2E_RESULT: ${{ needs.e2e-p0.outputs.result }}
          F201_JOB: ${{ needs.e2e-f2-01.result }}
          F201_MODE: ${{ needs.e2e-f2-01.outputs.mode }}
          F201_RESULT: ${{ needs.e2e-f2-01.outputs.result }}
        run: |
          echo "## Frontend Quality Gates (PQ-09 + F2-01)"
          echo "L1 quality: ${QUALITY}"
          echo "Preview resolve: ${PREVIEW} url=${PREVIEW_URL}"
          echo "L2 e2e-p0 job: ${E2E_JOB} (mode=${E2E_MODE} result=${E2E_RESULT})"
          echo "L2 e2e-f2-01 job: ${F201_JOB} (mode=${F201_MODE} result=${F201_RESULT})"
          echo ""
          echo "Policy:"
          echo "  - L1 must pass on every PR"
          echo "  - Preview URL is the READY GitHub Deployment for github.sha"
          echo "  - L2 e2e-p0 blocks when consultation secrets configured; skipped otherwise"
          echo "  - L2 e2e-f2-01 blocks when auth triad configured; skipped otherwise"
          echo "  - L3 release checklist: docs/pq-09-quality-gates.md"

          if [[ "$QUALITY" != "success" ]]; then
            echo "::error::L1 quality failed"
            exit 1
          fi

          if [[ "$PREVIEW" != "success" ]]; then
            echo "::error::Infrastructure: no READY Vercel Preview for this SHA. Playwright was not executed."
            exit 1
          fi

          if [[ "$E2E_MODE" == "run" && "$E2E_RESULT" == "fail" ]]; then
            echo "::error::L2 E2E P0 failed (secrets present — blocking)"
            exit 1
          fi

          if [[ "$E2E_MODE" == "run" && "$E2E_JOB" != "success" && "$E2E_RESULT" != "pass" ]]; then
            echo "::error::L2 E2E P0 job did not succeed"
            exit 1
          fi

          if [[ "$F201_MODE" == "run" && "$F201_RESULT" == "fail" ]]; then
            echo "::error::L2 F2-01 Agenda/Auth E2E failed (auth secrets present — blocking)"
            exit 1
          fi

          if [[ "$F201_MODE" == "run" && "$F201_JOB" != "success" && "$F201_RESULT" != "pass" ]]; then
            echo "::error::L2 F2-01 job did not succeed"
            exit 1
          fi

          if [[ "$E2E_MODE" == "skipped" ]]; then
            echo "::notice::L2 E2E P0 skipped (secrets unavailable) — aggregate PASS with degradation"
          else
            echo "L2 E2E P0: PASS"
          fi

          if [[ "$F201_MODE" == "skipped" ]]; then
            echo "::notice::L2 F2-01 skipped (auth triad unavailable) — aggregate PASS with degradation"
          else
            echo "L2 F2-01 Agenda/Auth: PASS"
          fi

          echo "Aggregate frontend: PASS"
          exit 0
