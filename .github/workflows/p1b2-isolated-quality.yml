name: HeyDoctor P1-B.2 Isolated Quality Gate

on:
  push:
    branches:
      - fix/web-p1b2-patient-continuity-20261025
      - qa/web-p2e-patient-handoff-20261026

permissions:
  contents: read

concurrency:
  group: p1b2-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1b2-quality:
    name: P1-B.2 patient continuity QA (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated P1-B.2 branch and SHA
        run: |
          case "${GITHUB_REF_NAME}" in
            fix/web-p1b2-patient-continuity-20261025|qa/web-p2e-patient-handoff-20261026) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Component tests
        run: npm run test:component
      - name: Next build
        run: npm run build
